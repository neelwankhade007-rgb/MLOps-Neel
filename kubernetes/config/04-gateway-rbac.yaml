apiVersion: v1
kind: ServiceAccount
metadata:
  name: inference-gateway-sa
  namespace: mlops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: inference-gateway-telemetry-reader
  namespace: mlops
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: inference-gateway-telemetry-reader
  namespace: mlops
subjects:
  - kind: ServiceAccount
    name: inference-gateway-sa
    namespace: mlops
roleRef:
  kind: Role
  name: inference-gateway-telemetry-reader
  apiGroup: rbac.authorization.k8s.io
