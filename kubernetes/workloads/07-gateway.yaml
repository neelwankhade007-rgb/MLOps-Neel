apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-gateway
  namespace: mlops
  labels:
    app: inference-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference-gateway
  template:
    metadata:
      labels:
        app: inference-gateway
    spec:
      serviceAccountName: inference-gateway-sa
      initContainers:
        - name: wait-for-inference
          image: busybox
          command: ["sh", "-c", "until nc -z inference-service 8000; do echo waiting for inference-service; sleep 2; done;"]
      containers:
        - name: inference-gateway
          image: mlops-gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: HEADLESS_DNS
              value: "inference-service-headless.mlops.svc.cluster.local"
            - name: INFERENCE_PORT
              value: "8000"
            - name: DISCOVERY_INTERVAL_S
              value: "10"
            - name: WRR_WEIGHTS
              valueFrom:
                configMapKeyRef:
                  name: mlops-config
                  key: WRR_WEIGHTS
            - name: ADAPTIVE_METRICS_INTERVAL_S
              valueFrom:
                configMapKeyRef:
                  name: mlops-config
                  key: ADAPTIVE_METRICS_INTERVAL_S
            - name: ADAPTIVE_EMA_ALPHA
              valueFrom:
                configMapKeyRef:
                  name: mlops-config
                  key: ADAPTIVE_EMA_ALPHA
            - name: ADAPTIVE_METRIC_MAX_AGE_S
              valueFrom:
                configMapKeyRef:
                  name: mlops-config
                  key: ADAPTIVE_METRIC_MAX_AGE_S
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: inference-gateway
  namespace: mlops
  labels:
    app: inference-gateway
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app: inference-gateway
